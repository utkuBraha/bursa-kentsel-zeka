name: bursa-urban
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-urban}
    ports: ["127.0.0.1:${BURSA_DB_PORT:-5433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-urban}:${POSTGRES_PASSWORD:-urban_local_dev}@db:5432/${POSTGRES_DB:-urban}
    ports: ["127.0.0.1:${BURSA_API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 4s
      start_period: 4m
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:${BURSA_APP_PORT:-3016}:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
